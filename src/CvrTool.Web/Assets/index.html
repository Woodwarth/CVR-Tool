<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CVR Tool</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header>
      <strong>CVR Tool</strong><span>Browser control</span
      ><button id="connect">Access key</button>
    </header>
    <main>
      <label class="device"
        >Device
        <select id="devices" aria-label="Device"></select
      ></label>
      <section id="identity"></section>
      <nav>
        <button data-tab="Main" class="active">Main</button
        ><button data-tab="Inputs">Inputs</button
        ><button data-tab="Outputs">Outputs</button
        ><button data-tab="Presets">Presets</button>
      </nav>
      <p id="status" role="status">
        Connect using the link shown in the desktop app.
      </p>
      <section id="page"></section>
    </main>
    <dialog id="editor">
      <form method="dialog">
        <h2 id="editor-title"></h2>
        <div id="editor-body"></div>
        <p id="editor-error" role="alert"></p>
        <div class="actions">
          <button id="apply" type="button">Apply</button
          ><button value="cancel">Cancel</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
