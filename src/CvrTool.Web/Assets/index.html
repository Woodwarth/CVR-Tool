<!doctype html>
<!-- Module: Serves the local browser interface and routes authenticated requests to the shared session.
     Defines the browser page and loads its styles and controls. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CVR Tool</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header>
      <strong>CVR Tool</strong>
      <div id="app-connection" data-state="connecting" role="status" aria-live="polite">
        <i class="led"></i><b>Browser control</b><span id="connection-title">Connecting…</span>
        <span id="connection-detail" class="sr-only"></span>
      </div>
      <select id="appearance" aria-label="Appearance"><option>System</option><option>Light</option><option>Dark</option></select>
      <button id="connect">Access key</button><button id="disconnect">Disconnect</button>
    </header>
    <fieldset id="controls" disabled>
      <div class="app-layout">
        <aside class="device-sidebar">
          <h2>Devices</h2>
          <select id="devices" aria-label="Device"></select>
          <div id="device-list"></div>

        </aside>
        <main>
          <section id="identity"></section>
          <nav>
            <button data-tab="Main" class="active">⌂ Main</button>
            <button data-tab="Inputs">◉ Inputs</button>
            <button data-tab="Outputs">◖ Outputs</button>
            <button data-tab="Presets">☰ Presets</button>
          </nav>

          <section id="page"></section>
        </main>
      </div>
    </fieldset>
    <footer id="status" role="status"></footer>
    <dialog id="editor">
      <form method="dialog">
        <h2 id="editor-title"></h2>
        <p
          id="editor-connection"
          class="connection-warning hidden"
          role="alert"
        ></p>
        <fieldset id="editor-controls"><div id="editor-body"></div></fieldset>
        <p id="editor-error" role="alert"></p>
        <div class="actions">
          <fieldset id="editor-commit">
            <button id="apply" type="button">Apply</button>
          </fieldset>
          <button value="cancel" formnovalidate>Cancel</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
