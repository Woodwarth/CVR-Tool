name: Platform packages and draft release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Validate tag version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -ne "v$($props.Project.PropertyGroup.Version)") {
            throw 'Tag does not match project version'
          }
      - run: dotnet restore CvrTool.slnx --configfile NuGet.Config --locked-mode
      - run: dotnet build CvrTool.slnx -c Release --no-restore
      - run: dotnet run --project tests/CvrTool.Checks -c Release --no-build
      - run: dotnet run --project tests/CvrTool.NetworkChecks -c Release --no-build
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.x'
      - run: python scripts/check-mcp.py Release
      - shell: pwsh
        run: ./scripts/package.ps1 -Runtime ${{ matrix.rid }}
      - name: Verify native update installation
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = [string]$props.Project.PropertyGroup.Version
          $extension = if ($IsWindows) { 'zip' } else { 'tar.gz' }
          dotnet run --project tests/CvrTool.Checks -c Release --no-build -- --update-package "artifacts/CVR-Tool-$version-${{ matrix.rid }}.$extension" "${{ matrix.rid }}" "$version"
          if ($LASTEXITCODE -ne 0) { throw 'Native update installation failed' }
      - name: Test self-contained MCP executable
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = [string]$props.Project.PropertyGroup.Version
          $binary = if ($IsWindows) { 'desktop/CvrTool.Desktop.exe' } else { 'CVR Tool.app/Contents/MacOS/CvrTool.Desktop' }
          $env:CVR_MCP_INTEGRATED = '1'
          $env:CVR_MCP_HANDOFF = '1'
          $env:CVR_MCP_EXECUTABLE = Join-Path $PWD "artifacts/update-install-check/versions/$version/${{ matrix.rid }}/$binary"
          $env:DOTNET_ROOT = Join-Path $PWD 'artifacts/no-installed-runtime'
          $env:DOTNET_MULTILEVEL_LOOKUP = '0'
          python scripts/check-mcp.py Release
          if ($LASTEXITCODE -ne 0) { throw 'Packaged executable test failed' }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cvr-tool-${{ matrix.rid }}
          path: artifacts/CVR-Tool-*
          if-no-files-found: error
  draft:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: cvr-tool-*
          path: artifacts
          merge-multiple: true
      - name: Verify all platform archives were downloaded
        run: test "$(find artifacts -maxdepth 1 -type f -name 'CVR-Tool-*' | wc -l)" -eq 3
      - name: Write package checksums
        run: sha256sum artifacts/CVR-Tool-* > artifacts/SHA256SUMS.txt
      - name: Create draft only
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/CVR-Tool-* artifacts/SHA256SUMS.txt --draft --title "CVR Tool $GITHUB_REF_NAME" --notes "Output EQ/FIR, sixteen device presets and PC .sd/JSON load/save. GitHub updates with verified native installation. Self-contained Windows x64/ARM64 and Apple Silicon packages. Physical-amplifier validation remains pending; Mac packages are not notarized."
