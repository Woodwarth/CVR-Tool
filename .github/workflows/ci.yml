name: Build and checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, windows-11-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore CvrTool.slnx --configfile NuGet.Config --locked-mode
      - run: dotnet build CvrTool.slnx -c Release --no-restore
      - run: dotnet run --project tests/CvrTool.Checks -c Release --no-build
      - run: dotnet run --project tests/CvrTool.NetworkChecks -c Release --no-build
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.x'
      - run: python scripts/check-mcp.py Release
